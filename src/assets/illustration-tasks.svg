<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"
     aria-labelledby="illustration-title illustration-desc">
  <title id="illustration-title">Two teammates working through a shared task list</title>
  <desc id="illustration-desc">A flat illustration of a task board with checked and unchecked items,
    with one person pointing at it and another carrying a completed check.</desc>

  <!--
    Hex values mirror design/assets/tokens.css. An SVG loaded through <img> cannot read the page's
    CSS variables, so the palette is repeated here — keep the two in step when tokens change.
      teal-50 #F0FBFA · teal-100 #D9F5F2 · teal-200 #A9E9E3 · teal-300 #6FD8D0
      teal-400 #24C0B8 · teal-500 #12A79F · teal-600 #0A7F78 · teal-800 #0B5A55 · teal-950 #06302E
      neutral-200 #E3E8E7 · surface #FFFFFF · skin #F3CBA9 / #E8B893
  -->

  <!-- backdrop -->
  <ellipse cx="240" cy="150" rx="215" ry="132" fill="#A9E9E3" opacity="0.28" />
  <ellipse cx="240" cy="232" rx="188" ry="22" fill="#6FD8D0" opacity="0.35" />

  <!-- task board -->
  <g>
    <rect x="146" y="46" width="196" height="178" rx="16" fill="#FFFFFF" />
    <rect x="146" y="46" width="196" height="178" rx="16" fill="none" stroke="#D9F5F2"
          stroke-width="2" />

    <!-- board header -->
    <rect x="166" y="68" width="88" height="10" rx="5" fill="#A9E9E3" />
    <rect x="166" y="86" width="54" height="7" rx="3.5" fill="#D9F5F2" />
    <rect x="298" y="68" width="26" height="10" rx="5" fill="#24C0B8" opacity="0.5" />

    <!-- row 1 — done -->
    <rect x="166" y="112" width="20" height="20" rx="6" fill="#0A7F78" />
    <path d="M171 122.5l3.6 3.6 6.4-7" fill="none" stroke="#FFFFFF" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="196" y="117" width="98" height="8" rx="4" fill="#D9F5F2" />
    <rect x="304" y="115" width="20" height="12" rx="6" fill="#F0FBFA" stroke="#A9E9E3" />

    <!-- row 2 — done -->
    <rect x="166" y="150" width="20" height="20" rx="6" fill="#0A7F78" />
    <path d="M171 160.5l3.6 3.6 6.4-7" fill="none" stroke="#FFFFFF" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round" />
    <rect x="196" y="155" width="76" height="8" rx="4" fill="#D9F5F2" />
    <rect x="282" y="153" width="20" height="12" rx="6" fill="#F0FBFA" stroke="#A9E9E3" />

    <!-- row 3 — still open -->
    <rect x="166" y="188" width="20" height="20" rx="6" fill="#FFFFFF" stroke="#6FD8D0"
          stroke-width="2" />
    <rect x="196" y="193" width="110" height="8" rx="4" fill="#E3E8E7" />
  </g>

  <!-- person, left: pointing at the board -->
  <g>
    <rect x="74" y="186" width="14" height="50" rx="7" fill="#06302E" />
    <rect x="92" y="186" width="14" height="50" rx="7" fill="#0B5A55" />
    <rect x="68" y="230" width="24" height="9" rx="4.5" fill="#0B5A55" />
    <rect x="88" y="230" width="24" height="9" rx="4.5" fill="#06302E" />

    <rect x="68" y="138" width="44" height="56" rx="16" fill="#0A7F78" />
    <path d="M110 152 L140 132" fill="none" stroke="#0A7F78" stroke-width="12"
          stroke-linecap="round" />
    <circle cx="143" cy="130" r="7.5" fill="#F3CBA9" />

    <rect x="85" y="126" width="10" height="14" rx="5" fill="#E8B893" />
    <circle cx="90" cy="112" r="17" fill="#F3CBA9" />
    <path d="M73 112q0-19 17-19t17 19q-5-9-17-9t-17 9z" fill="#06302E" />
  </g>

  <!-- person, right: carrying a completed check -->
  <g>
    <rect x="378" y="192" width="13" height="46" rx="6.5" fill="#0B5A55" />
    <rect x="395" y="192" width="13" height="46" rx="6.5" fill="#06302E" />
    <rect x="372" y="232" width="23" height="9" rx="4.5" fill="#06302E" />
    <rect x="391" y="232" width="23" height="9" rx="4.5" fill="#0B5A55" />

    <rect x="371" y="148" width="42" height="52" rx="15" fill="#24C0B8" />
    <path d="M373 168 L346 180" fill="none" stroke="#24C0B8" stroke-width="11"
          stroke-linecap="round" />
    <circle cx="343" cy="181" r="7.5" fill="#F3CBA9" />

    <rect x="387" y="136" width="10" height="14" rx="5" fill="#E8B893" />
    <circle cx="392" cy="122" r="16" fill="#F3CBA9" />
    <path d="M376 122q0-18 16-18t16 18q-4-8-16-8t-16 8z" fill="#0B5A55" />
    <circle cx="408" cy="106" r="8" fill="#0B5A55" />
  </g>

  <!-- floating check badge -->
  <circle cx="122" cy="60" r="19" fill="#24C0B8" />
  <path d="M114 60.5l5 5 9.5-10.5" fill="none" stroke="#FFFFFF" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- floating label chip -->
  <g>
    <rect x="336" y="26" width="86" height="28" rx="14" fill="#FFFFFF" stroke="#D9F5F2"
          stroke-width="2" />
    <circle cx="352" cy="40" r="5" fill="#12A79F" />
    <rect x="364" y="36" width="44" height="8" rx="4" fill="#D9F5F2" />
  </g>

  <!-- floating due-date chip -->
  <g>
    <rect x="46" y="152" width="42" height="34" rx="10" fill="#FFFFFF" stroke="#D9F5F2"
          stroke-width="2" opacity="0.95" />
    <rect x="46" y="152" width="42" height="11" rx="5.5" fill="#6FD8D0" />
    <rect x="54" y="169" width="12" height="6" rx="3" fill="#A9E9E3" />
    <rect x="70" y="169" width="10" height="6" rx="3" fill="#E3E8E7" />
  </g>

  <!-- confetti dots -->
  <circle cx="424" cy="176" r="4" fill="#6FD8D0" />
  <circle cx="60" cy="98" r="3.5" fill="#24C0B8" opacity="0.7" />
  <circle cx="300" cy="252" r="3" fill="#12A79F" opacity="0.5" />
</svg>
